name: metrics-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp clean verify
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: Runtime dependency inventory
        run: mvn -B -ntp dependency:tree -Dscope=runtime
      - run: docker build -t sky-metrics:ci .
      - name: Verify non-root image
        run: test "$(docker image inspect sky-metrics:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Smoke health
        run: |
          id=$(docker run -d -p 18080:8080 sky-metrics:ci)
          trap 'docker rm -f "$id"' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:18080/healthz && exit 0; sleep 1; done
          exit 1
